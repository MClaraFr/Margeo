name: margeo 

services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: margeo_php
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./apps/api:/var/www
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - mysql
    networks:
      - margeo

  nginx:
    image: nginx:alpine
    container_name: margeo_nginx
    restart: unless-stopped
    ports:
      - "8183:80"
    volumes:
      - ./apps/api:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - margeo

  mysql:
    image: mysql:9
    container_name: margeo_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:33107:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
    networks:
      - margeo

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: margeo_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8185:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - margeo

volumes:
  mysql_data:

networks:
  margeo:

